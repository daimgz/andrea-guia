[bar/bar1]
width = 100%
height = 24pt
radius = 0

fixed-center = true
bottom = false

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt
line-color = ${colors.primary}

border-size = 0
border-color = ${colors.border}

padding-left = 0
padding-right = 2

module-margin-left = 1
module-margin-right = 1

font-0 = "MesloLGS NF:size=14;2"
font-1 = "Font Awesome 6 Free:style=Solid:pixelsize=14;1"
font-2 = "JetBrainsMono Nerd Font:size=14;1"

modules-left = i3 workspaces
modules-center =
modules-right = stopwatch audio battery pc mytime

enable-ipc = true

wm-restack = i3
override-redirect = false

[bar/bar2]
inherit = bar/bar1
bottom = true
modules-left =
modules-center =
modules-right = resources_monitor space ping

[colors]
background = #1A0B2E
foreground = #E0AAFF
primary = #FF00E5
secondary = #BD93F9
tertiary = #3C096C
success = #A3BE8C
warning = #EBCB8B
danger = #FF5400
border = #120521

[module/i3]
type = internal/i3
format = <label-state> <label-mode>
index-sort = true
wrapping-scroll = false

label-mode-padding = 2
label-mode-foreground = ${colors.foreground}
label-mode-background = #360aa9

label-focused = %name%
label-focused-background = #360aa9
label-focused-foreground = ${colors.foreground}
label-focused-padding = 2

label-unfocused = %name%
label-unfocused-background = ${colors.background}
label-unfocused-foreground = #7B2CBF
label-unfocused-padding = 2

label-visible = %name%
label-visible-background = ${colors.tertiary}
label-visible-foreground = ${colors.foreground}
label-visible-padding = 2

label-urgent = %name%
label-urgent-background = ${colors.danger}
label-urgent-foreground = #ffffff
label-urgent-padding = 2

[module/resources_monitor]
type = custom/script
exec = ~/.config/polybar/scripts/resources_monitor.sh
interval = 2
format-prefix = "%{T2}💻%{T-} "
format-foreground = ${colors.foreground}
format-prefix-foreground = ${colors.tertiary}

[module/space]
type = custom/script
exec = ~/.config/polybar/scripts/space.sh
interval = 1
click-left = ~/.config/polybar/scripts/space.sh left
format-foreground = ${colors.foreground}
format-prefix = "%{T2}💾%{T-} "
format-prefix-foreground = ${colors.secondary}

[module/ping]
type = custom/script
exec = ~/.config/polybar/scripts/ping.sh
interval = 1
click-left = ~/.config/polybar/scripts/ping.sh toggle
format-foreground = ${colors.foreground}
format-prefix-foreground = ${colors.tertiary}

[module/audio]
type = custom/script
exec = ~/.config/polybar/scripts/audio_new.py
interval = 0.000o
flush = true
tail = true
click-left = ~/.config/polybar/scripts/audio_new.py mute
click-right = ~/.config/polybar/scripts/audio_new.py next
scroll-up = ~/.config/polybar/scripts/audio_new.py up
scroll-down = ~/.config/polybar/scripts/audio_new.py down
format-foreground = ${colors.foreground}

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98
time-format = %H:%M

format-charging = <animation-charging> <label-charging>
format-charging-foreground = ${colors.success}
format-charging-prefix = "%{T2}⚡%{T-} "
format-charging-prefix-foreground = ${colors.success}

format-discharging = <ramp-capacity> <label-discharging>
format-discharging-foreground = ${colors.foreground}

format-full-prefix = "%{T2}🔋%{T-} "
format-full-prefix-foreground = ${colors.success}

label-charging = %percentage%% %time%
label-discharging = %percentage%% %time%
ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-foreground = ${colors.foreground}

animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-framerate = 750

[module/stopwatch]
type = custom/script
exec = ~/.config/polybar/scripts/stopwatch.sh
interval = 1
click-left = ~/.config/polybar/scripts/stopwatch.sh toggle
click-right = ~/.config/polybar/scripts/stopwatch.sh display
click-middle = ~/.config/polybar/scripts/stopwatch.sh reset
format-foreground = ${colors.foreground}

[module/mytime]
type = custom/script
exec = ~/.config/polybar/scripts/mytime.sh
interval = 1
click-left = ~/.config/polybar/scripts/mytime.sh toggle
format-foreground = ${colors.foreground}
format-prefix = "%{T2}📅%{T-} "
format-prefix-foreground = ${colors.tertiary}

[settings]
screenchange-reload = true
pseudo-transparency = false
